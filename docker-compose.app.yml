# Side-by-side deploy of the NEW Fairway360 on its own DB + network, for
# app.fairway360.io, behind an existing shared reverse proxy (no Caddy here).
# Distinct container/network/volume names so it never clashes with an older
# fairway360 stack running on the same host. See deploy-app.sh.
services:
  db:
    image: postgres:16
    container_name: fairway-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fairway
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fairway360
    volumes:
      - fairwayv2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairway -d fairway360"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: fairway360:v2
    container_name: fairway-v2-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Secrets are loaded STRAIGHT FROM .env into the container via env_file —
    # NOT through docker-compose ${VAR} interpolation. Interpolation reads the
    # shell environment first, so a stale exported OPENAI_API_KEY (left behind by
    # deploy-app.sh) silently shadowed the real key in .env and kept taking the
    # AI down after deploys. env_file has no shell step, so it can't be shadowed.
    # This also picks up VAPI_WEBHOOK_SECRET / CAL_API_KEY / CAL_EVENT_TYPE_ID
    # from .env automatically — no need to list them here.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Only these two need composing from other vars, so they stay interpolated
      # (DB_PASSWORD/DOMAIN come from --env-file at deploy time).
      DATABASE_URL: postgres://fairway:${DB_PASSWORD}@db:5432/fairway360
      APP_URL: https://${DOMAIN}
    expose:
      - "5000"

volumes:
  fairwayv2_pgdata:

networks:
  default:
    name: fairwayv2net
